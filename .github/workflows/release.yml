name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Strict stable SemVer without v, for example 1.4.0"
        required: true
        type: string
      tag:
        description: "Exact release tag, for example v1.4.0"
        required: true
        type: string
      source_commit:
        description: "Exact 40-character source commit SHA"
        required: true
        type: string
      channel:
        description: "Only the stable update channel is supported"
        required: true
        default: stable
        type: choice
        options:
          - stable

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-candidate:
    name: Build and attest unsigned release candidate
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_WORKFLOW_RUN_ID: ${{ github.run_id }}
      RELEASE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      RELEASE_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}

    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Validate immutable candidate identity
        shell: pwsh
        run: |
          ./scripts/Test-ReleaseIdentity.ps1 `
            -Version $env:RELEASE_VERSION `
            -Tag $env:RELEASE_TAG `
            -SourceCommit $env:RELEASE_SOURCE_COMMIT `
            -Channel $env:RELEASE_CHANNEL `
            -RepositoryRoot $env:GITHUB_WORKSPACE

          if (git status --porcelain --untracked-files=no) {
            throw 'Tracked build inputs are not clean.'
          }

      - name: Validate PowerShell release tools
        shell: pwsh
        run: |
          $scripts = @(
            './scripts/ReleasePipeline.psm1',
            './scripts/Test-ReleaseIdentity.ps1',
            './scripts/New-ReleaseCandidate.ps1',
            './scripts/Invoke-OfflineManifestSigning.ps1',
            './scripts/Publish-ImmutableRelease.ps1',
            './scripts/tests/Test-ReleasePipeline.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -ne 0) {
              throw "PowerShell parser errors in $script`: $($errors -join '; ')"
            }
          }

      - name: Run focused release-pipeline tests
        shell: pwsh
        run: ./scripts/tests/Test-ReleasePipeline.ps1

      - name: Run complete managed validation
        shell: pwsh
        run: |
          dotnet test ./PimaxVrcSupervisor.Tests/PimaxVrcSupervisor.Tests.csproj -c Debug
          if ($LASTEXITCODE -ne 0) { throw 'Debug managed tests failed.' }
          dotnet test ./PimaxVrcSupervisor.Tests/PimaxVrcSupervisor.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Release managed tests failed.' }

          $projects = @(
            './PimaxVrcSupervisor/PimaxVrcSupervisor.csproj',
            './PimaxVrcSupervisor.ConfigEditor/PimaxVrcSupervisor.ConfigEditor.csproj',
            './PimaxVrcSupervisor.SteamVrHost/PimaxVrcSupervisor.SteamVrHost.csproj',
            './PimaxVrcSupervisor.Tests/PimaxVrcSupervisor.Tests.csproj'
          )
          foreach ($configuration in @('Debug', 'Release')) {
            foreach ($project in $projects) {
              dotnet build $project -c $configuration --no-restore
              if ($LASTEXITCODE -ne 0) { throw "$configuration build failed for $project." }
            }
          }
          foreach ($project in $projects) {
            dotnet format $project --verify-no-changes --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Formatting failed for $project." }
          }

      - name: Run complete Rust validation
        shell: pwsh
        run: |
          cargo fmt --manifest-path ./PimaxVrcSupervisor.Tui/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed.' }
          cargo clippy --manifest-path ./PimaxVrcSupervisor.Tui/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Debug Rust clippy failed.' }
          cargo clippy --manifest-path ./PimaxVrcSupervisor.Tui/Cargo.toml --release --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Release Rust clippy failed.' }
          cargo test --manifest-path ./PimaxVrcSupervisor.Tui/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Debug Rust tests failed.' }
          cargo test --manifest-path ./PimaxVrcSupervisor.Tui/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Release Rust tests failed.' }
          cargo build --manifest-path ./PimaxVrcSupervisor.Tui/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Debug Rust build failed.' }
          cargo build --manifest-path ./PimaxVrcSupervisor.Tui/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'Release Rust build failed.' }

      - name: Validate documentation
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check mkdocs-material
          python -m mkdocs build --strict
          if ($LASTEXITCODE -ne 0) { throw 'Strict MkDocs validation failed.' }
          if (Test-Path -LiteralPath ./site) {
            Remove-Item -LiteralPath ./site -Recurse -Force
          }

      - name: Build both final package variants
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 `
            -Version $env:RELEASE_TAG `
            -Runtime win-x64 `
            -Configuration Release `
            -ReleaseRoot ./artifacts

          New-Item -ItemType Directory -Path ./candidate -Force | Out-Null
          $zips = @(Get-ChildItem -LiteralPath ./artifacts -File -Filter '*.zip')
          if ($zips.Count -ne 2) {
            throw "Expected exactly two package ZIPs, found $($zips.Count)."
          }
          foreach ($zip in $zips) {
            Copy-Item -LiteralPath $zip.FullName -Destination ./candidate
            $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText(
              (Join-Path ./candidate "$($zip.Name).sha256"),
              "$hash  $($zip.Name)",
              [Text.UTF8Encoding]::new($false))
          }

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sigstore-sign package candidates
        shell: pwsh
        run: |
          foreach ($zip in Get-ChildItem -LiteralPath ./candidate -File -Filter '*.zip') {
            cosign sign-blob --yes --bundle "$($zip.FullName).sigstore.json" $zip.FullName
            if ($LASTEXITCODE -ne 0) { throw "Cosign failed for $($zip.Name)." }
          }

      - name: Attest with-dotnet9 package
        id: attest_with
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: candidate/PimaxVrcSupervisor-${{ inputs.tag }}-win-x64-with-dotnet9.zip

      - name: Preserve with-dotnet9 attestation bundle
        shell: pwsh
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest_with.outputs.bundle-path }}
        run: Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE_PATH -Destination "./candidate/PimaxVrcSupervisor-$env:RELEASE_TAG-win-x64-with-dotnet9.zip.attestation.json"

      - name: Attest no-dotnet9 package
        id: attest_without
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: candidate/PimaxVrcSupervisor-${{ inputs.tag }}-win-x64-no-dotnet9.zip

      - name: Preserve no-dotnet9 attestation bundle
        shell: pwsh
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest_without.outputs.bundle-path }}
        run: Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE_PATH -Destination "./candidate/PimaxVrcSupervisor-$env:RELEASE_TAG-win-x64-no-dotnet9.zip.attestation.json"

      - name: Generate exact-byte update manifest
        shell: pwsh
        run: |
          $commitTime = [DateTimeOffset]::Parse((git show -s --format=%cI $env:RELEASE_SOURCE_COMMIT)).UtcDateTime.ToString('yyyy-MM-ddTHH:mm:ssZ')
          ./scripts/New-ReleaseCandidate.ps1 `
            -Stage Manifest `
            -CandidateDirectory ./candidate `
            -Version $env:RELEASE_VERSION `
            -Tag $env:RELEASE_TAG `
            -SourceCommit $env:RELEASE_SOURCE_COMMIT `
            -Channel $env:RELEASE_CHANNEL `
            -GeneratedAtUtc $commitTime

      - name: Sigstore-sign update manifest
        shell: pwsh
        run: |
          $manifest = Resolve-Path './candidate/PimaxVrcSupervisor-${{ inputs.tag }}-update-manifest-v1.json'
          cosign sign-blob --yes --bundle "$manifest.sigstore.json" $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Cosign failed for the update manifest.' }

      - name: Attest update manifest
        id: attest_manifest
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: candidate/PimaxVrcSupervisor-${{ inputs.tag }}-update-manifest-v1.json

      - name: Preserve manifest attestation and finalize inventory
        shell: pwsh
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest_manifest.outputs.bundle-path }}
        run: |
          Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE_PATH -Destination "./candidate/PimaxVrcSupervisor-$env:RELEASE_TAG-update-manifest-v1.json.attestation.json"
          ./scripts/New-ReleaseCandidate.ps1 `
            -Stage Complete `
            -CandidateDirectory ./candidate `
            -Version $env:RELEASE_VERSION `
            -Tag $env:RELEASE_TAG `
            -SourceCommit $env:RELEASE_SOURCE_COMMIT `
            -Channel $env:RELEASE_CHANNEL `
            -WorkflowRunId $env:RELEASE_WORKFLOW_RUN_ID `
            -WorkflowRunAttempt $env:RELEASE_WORKFLOW_RUN_ATTEMPT `
            -WorkflowRunUrl $env:RELEASE_WORKFLOW_RUN_URL `
            -WorkflowRef $env:RELEASE_WORKFLOW_REF

          if (Get-ChildItem -LiteralPath ./candidate -File | Where-Object { $_.Name -match '\.sig$|signatures\.json$|offline-signing-report\.json$' }) {
            throw 'The unsigned candidate must not contain an offline ECDSA signature or signing report.'
          }

      - name: Upload one bounded unsigned candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PimaxVrcSupervisor-${{ inputs.tag }}-unsigned-release-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
